<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Prospecção de CNPJs</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Choices.js para habilitar busca em tempo real nos selects -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <h2 class="mb-4">Filtros de Prospecção de Empresas</h2>
        <form action="/resultados" method="POST" class="card p-4 shadow-sm">

            <!-- Seção de Dados do Remetente e Objetivo -->
            <h4 class="mb-3 text-secondary">1. Dados para Abordagem por IA</h4>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label"><strong>Seu Nome:</strong></label>
                    <input type="text" name="remetente_nome" class="form-control" placeholder="Ex: Luis Bonetto" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label"><strong>Seu Cargo:</strong></label>
                    <input type="text" name="remetente_cargo" class="form-control" placeholder="Ex: Técnico de Manutenção" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label"><strong>Sua Empresa:</strong></label>
                    <input type="text" name="remetente_empresa" class="form-control" placeholder="Ex: Sua Empresa / Autônomo" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label"><strong>Objetivo da Prospecção:</strong></label>
                <textarea name="objetivo_prospeccao" class="form-control" rows="2" placeholder="Ex: Oferecer serviços de manutenção preventiva e corretiva em inversores de frequência e painéis elétricos." required></textarea>
            </div>

            <hr class="mb-4">
            <h4 class="mb-3 text-secondary">2. Filtros de Empresas</h4>

            <div class="row">
                <!-- Busca por Razão Social / Nome -->
                <div class="col-md-6 mb-3">
                    <label class="form-label"><strong>Razão Social ou Nome Fantasia:</strong></label>
                    <input type="text" name="busca_nome" class="form-control" placeholder="Ex: Tecno, Metalúrgica, Mercado...">
                </div>

                <!-- Busca por CNPJ -->
                <div class="col-md-6 mb-3">
                    <label class="form-label"><strong>CNPJ Específico:</strong></label>
                    <input type="text" name="cnpj_busca" class="form-control" placeholder="Digite apenas os números do CNPJ">
                </div>
            </div>

            <div class="row">
                <!-- Campo de Estados do Brasil -->
                <div class="col-md-4 mb-3">
                    <label class="form-label"><strong>Estado (UF):</strong></label>
                    <select name="estado" id="estado" class="form-select" onchange="carregarMunicipios(this.value)">
                        <option value="">Todos os Estados</option>
                        <option value="AC">Acre (AC)</option>
                        <option value="AL">Alagoas (AL)</option>
                        <option value="AP">Amapá (AP)</option>
                        <option value="AM">Amazonas (AM)</option>
                        <option value="BA">Bahia (BA)</option>
                        <option value="CE">Ceará (CE)</option>
                        <option value="DF">Distrito Federal (DF)</option>
                        <option value="ES">Espírito Santo (ES)</option>
                        <option value="GO">Goiás (GO)</option>
                        <option value="MA">Maranhão (MA)</option>
                        <option value="MT">Mato Grosso (MT)</option>
                        <option value="MS">Mato Grosso do Sul (MS)</option>
                        <option value="MG">Minas Gerais (MG)</option>
                        <option value="PA">Pará (PA)</option>
                        <option value="PB">Paraíba (PB)</option>
                        <option value="PR">Paraná (PR)</option>
                        <option value="PE">Pernambuco (PE)</option>
                        <option value="PI">Piauí (PI)</option>
                        <option value="RJ">Rio de Janeiro (RJ)</option>
                        <option value="RN">Rio Grande do Norte (RN)</option>
                        <option value="RS">Rio Grande do Sul (RS)</option>
                        <option value="RO">Rondônia (RO)</option>
                        <option value="RR">Roraima (RR)</option>
                        <option value="SC">Santa Catarina (SC)</option>
                        <option value="SP">São Paulo (SP)</option>
                        <option value="SE">Sergipe (SE)</option>
                        <option value="TO">Tocantins (TO)</option>
                    </select>
                </div>

                <!-- Filtro por Município / Cidade (Dinâmico com Choices.js) -->
                <div class="col-md-8 mb-3">
                    <label class="form-label"><strong>Município / Cidade:</strong></label>
                    <select name="municipio" id="municipio" class="form-select">
                        <option value="">A carregar municípios...</option>
                    </select>
                </div>
            </div>

            <!-- Situação Cadastral -->
            <div class="mb-3">
                <label class="form-label"><strong>Situação Cadastral:</strong></label>
                <select name="situacao" class="form-select">
                    <option value="ATIVA">Apenas Ativas</option>
                    <option value="TODAS">Todas as Situações</option>
                </select>
            </div>

            <!-- Ramo de Atuação / CNAE -->
            <div class="mb-3">
                <label class="form-label"><strong>Ramo de Atuação / CNAE:</strong></label>
                <select name="cnae" class="form-select" id="cnae-select">
                    <option value="">Selecione ou digite para buscar o CNAE...</option>
                    <!-- Mantido igual ao original para economizar espaço -->
                    <optgroup label="Seção C - Indústrias de Transformação">
                        <option value="25">25 - Fabricação de Produtos de Metal</option>
                        <option value="27">27 - Fabricação de Máquinas, Aparelhos e Materiais Elétricos</option>
                        <option value="33">33 - Manutenção, Reparação e Instalação de Máquinas e Equipamentos</option>
                    </optgroup>
                </select>
            </div>

            <button type="submit" class="btn btn-primary mt-3 w-100 btn-lg">Pesquisar e Extrair Empresas</button>
        </form>
    </div>

    <!-- Scripts do Choices.js -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        let choicesMunicipio = null;
        document.addEventListener('DOMContentLoaded', function () {
            const elementCnae = document.getElementById('cnae-select');
            if (elementCnae) { new Choices(elementCnae, { searchEnabled: true }); }
            const elementMunicipio = document.getElementById('municipio');
            if (elementMunicipio) {
                choicesMunicipio = new Choices(elementMunicipio, { searchEnabled: true, shouldSort: false });
                choicesMunicipio.setChoices([{ value: '', label: 'Selecione um estado primeiro...', disabled: true, selected: true }], 'value', 'label', true);
            }
        });

        async function carregarMunicipios(uf) {
            if (!choicesMunicipio) return;
            choicesMunicipio.clearChoices();
            if (!uf) {
                choicesMunicipio.setChoices([{ value: '', label: 'Selecione um estado primeiro...', disabled: true, selected: true }], 'value', 'label', true);
                return;
            }
            try {
                const response = await fetch(`/api/municipios/${encodeURIComponent(uf)}`);
                const data = await response.json();
                const opcoes = data.map(mun => ({ value: String(mun.codigo), label: mun.nome }));
                choicesMunicipio.setChoices(opcoes, 'value', 'label', true);
            } catch (error) {
                console.error('Erro ao buscar municípios:', error);
            }
        }
        window.carregarMunicipios = carregarMunicipios;
    </script>
</body>
</html>
