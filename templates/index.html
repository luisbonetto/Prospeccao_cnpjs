    <!-- Scripts do Choices.js -->
    <!-- Scripts do Choices.js -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<script>
    let choicesMunicipio = null;

    document.addEventListener('DOMContentLoaded', function () {
        const elementCnae = document.getElementById('cnae-select');
        if (elementCnae) {
            new Choices(elementCnae, {
                searchEnabled: true,
                itemSelectText: 'Clique para selecionar',
                noResultsText: 'Nenhum ramo encontrado',
                noChoicesText: 'Sem opções disponíveis'
            });
        }

        const elementMunicipio = document.getElementById('municipio');
        if (elementMunicipio) {
            choicesMunicipio = new Choices(elementMunicipio, {
                searchEnabled: true,
                itemSelectText: 'Clique para selecionar',
                noResultsText: 'Nenhum município encontrado',
                noChoicesText: 'Selecione um estado primeiro',
                shouldSort: false
            });

            choicesMunicipio.clearChoices();
            choicesMunicipio.setChoices([{
                value: '',
                label: 'Selecione um estado primeiro...',
                disabled: true,
                selected: true
            }], 'value', 'label', true);
        }
    });

    async function carregarMunicipios(uf) {
        console.log('Função carregarMunicipios executada:', uf);

        if (!choicesMunicipio) {
            console.error('Choices.js do município ainda não foi inicializado.');
            return;
        }

        choicesMunicipio.clearChoices();

        if (!uf) {
            choicesMunicipio.setChoices([{
                value: '',
                label: 'Selecione um estado primeiro...',
                disabled: true,
                selected: true
            }], 'value', 'label', true);
            return;
        }

        choicesMunicipio.setChoices([{
            value: '',
            label: 'Carregando municípios...',
            disabled: true,
            selected: true
        }], 'value', 'label', true);

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 15000);

        try {
            const response = await fetch(
                `/api/municipios/${encodeURIComponent(uf)}`,
                { signal: controller.signal }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.erro || `Erro HTTP ${response.status}`);
            }

            if (!Array.isArray(data)) {
                throw new Error('A API não retornou uma lista de municípios.');
            }

            choicesMunicipio.clearChoices();

            if (data.length === 0) {
                choicesMunicipio.setChoices([{
                    value: '',
                    label: 'Nenhum município encontrado para este estado',
                    disabled: true,
                    selected: true
                }], 'value', 'label', true);
                return;
            }

            const opcoes = data.map(mun => ({
                value: String(mun.codigo),
                label: mun.nome
            }));

            choicesMunicipio.setChoices(
                opcoes,
                'value',
                'label',
                true
            );

            console.log(`Municípios carregados para ${uf}: ${opcoes.length}`);
        } catch (error) {
            console.error('Erro ao buscar municípios:', error);

            choicesMunicipio.clearChoices();
            choicesMunicipio.setChoices([{
                value: '',
                label: error.name === 'AbortError'
                    ? 'Tempo esgotado (15 s) ao carregar municípios'
                    : `Erro ao carregar municípios: ${error.message}`,
                disabled: true,
                selected: true
            }], 'value', 'label', true);
        } finally {
            clearTimeout(timeout);
        }
    }

    // Permite que o onchange do HTML encontre a função.
    window.carregarMunicipios = carregarMunicipios;
</script>
</body>
</html>
